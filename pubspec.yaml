name: loki
description: "Habit & Weakness Tracker built with Flutter, Clean Architecture, GetX, and Firebase."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.7"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  dio: ^5.9.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  firebase_core: ^3.15.1
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  google_sign_in: 7.2.0
  flutter_local_notifications: ^19.3.0
  timezone: ^0.10.1
  fl_chart: ^0.71.0
  uuid: ^4.5.1
  loading_overlay_pro: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  fake_cloud_firestore: ^3.1.0
  firebase_auth_mocks: ^0.14.2

flutter:
  uses-material-design: true
